[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkguard"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = ["datasets==4.0.0", "pyarrow==26.0.0", "pyyaml==6.0.3", "transformers==4.57.1"]  # transformers: tokenizer

# uv sync installs dev by default; add --group gpu for training and eval (Linux + NVIDIA)
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
gpu = ["torch==2.8.0", "peft==0.18.1", "accelerate==1.11.0", "scikit-learn==1.9.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]  # pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["gpu: needs a CUDA GPU"]
