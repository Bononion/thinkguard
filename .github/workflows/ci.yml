name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e . ruff==0.17.1 pytest
      - run: ruff check
      - run: pytest -m "not gpu"
      - run: python -m thinkguard.data.verify_readme --committed-only
