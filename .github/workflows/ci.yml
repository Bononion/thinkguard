name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.3"
          enable-cache: true  # keyed on uv.lock
          prune-cache: false  # pruning drops downloaded wheels, and torch is the one worth keeping
      - run: uv sync --locked --group gpu  # fails if uv.lock is out of date; torch runs the model tests on CPU
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -m "not gpu"
