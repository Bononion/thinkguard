name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install uv==0.11.3
      - run: uv sync --locked  # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -m "not gpu"
      - run: uv run python -m thinkguard.data.verify_readme --committed-only
